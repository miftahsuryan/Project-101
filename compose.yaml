services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: production_app
      POSTGRES_PASSWORD: production_app
      POSTGRES_DB: production_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U production_app -d production_app
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: