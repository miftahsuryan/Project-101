[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "production-app"
version = "0.1.0"
description = "MVP for typed CSV ingestion and production monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
production-summary = "production_app.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
markers = [
    "integration: requires external infrastructure such as PostgreSQL",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]